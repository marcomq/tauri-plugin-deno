[package]
name = "tauri-plugin-deno"
version = "0.4.0"
authors = [ "Marco Mengelkoch" ]
description = "A tauri 2 plugin to use javascript code (deno) in the backend."
edition = "2024"
rust-version = "1.90"
exclude = ["/examples", "/webview-dist", "/webview-src", "/node_modules"]
links = "tauri-plugin-deno"
license = "MIT"
homepage = "https://github.com/marcomq/tauri-plugin-deno"
repository = "https://github.com/marcomq/tauri-plugin-deno"

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
deno_core = "0.413"
deno_fs = "0.170"
deno_runtime = { version = "0.268", features = ["transpile"] }
deno_resolver = "0.91"
deno_error = "0.7"
deno_media_type = "0.4"
futures = "0.3"
node_resolver = "0.98"
sys_traits = "0.1.28"
tokio = { version = "1", features = ["full"] }

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
