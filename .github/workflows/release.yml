name: Release

on:
  push:
    tags:
      - 'v*'
  # Manual "Run workflow" button to (re)publish the current version.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  TAURI_PLUGIN_DENO_DIST: ${{ github.workspace }}/tests/fixtures/deno_dist.js

jobs:
  release:
    name: Release
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: install dependencies (ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: test
        run: cargo test --release

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-crates-io:
    name: Publish to crates.io
    runs-on: ubuntu-22.04
    needs: release
    environment: release
    permissions:
      contents: read
      id-token: write # crates.io Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: install dependencies (ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Authenticate to crates.io (Trusted Publishing)
        uses: rust-lang/crates-io-auth-action@v1
        id: auth

      # Skipped if the version exists, so re-running the workflow doesn't fail.
      - name: Publish to crates.io
        run: |
          META=$(cargo metadata --no-deps --format-version=1)
          NAME=$(echo "$META" | jq -r '.packages[0].name')
          VERSION=$(echo "$META" | jq -r '.packages[0].version')
          if curl -sf -A "release-workflow" "https://crates.io/api/v1/crates/$NAME/$VERSION" > /dev/null; then
            echo "crates.io already has $NAME@$VERSION - skipping publish."
          else
            cargo publish
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-22.04
    needs: release
    environment: release
    permissions:
      contents: read
      id-token: write # npm Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          registry-url: 'https://registry.npmjs.org'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Trusted Publishing needs npm >= 11.5.1.
      - name: Upgrade npm
        run: npm install -g npm@latest

      - run: pnpm install
      - run: pnpm test

      # `prepublishOnly` builds dist-js. The npm CLI (not pnpm) uses OIDC.
      - name: Publish to npm
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if [ -n "$(npm view "$NAME@$VERSION" version 2>/dev/null)" ]; then
            echo "npm already has $NAME@$VERSION - skipping publish."
          else
            npm publish --access public
          fi
